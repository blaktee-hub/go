<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Open note</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         background: #141920; color: #E6E9EF; font: 17px -apple-system, system-ui, sans-serif; }
  a { display: inline-block; padding: 14px 28px; border-radius: 12px; background: #D4B27A;
      color: #141920; text-decoration: none; font-weight: 600; }
  p { text-align: center; }
</style>
</head>
<body>
<p id="msg">Opening your note…<br><br><a id="btn" href="#">Open in Notes</a></p>
<script>
  // Link format: https://blaktee-hub.github.io/go/#applenotes:note/<id>?ownerIdentifier=<owner>
  // The part after # never leaves the device. Only applenotes: targets are allowed.
  var target = decodeURIComponent(location.hash.slice(1));
  if (/^applenotes:/i.test(target)) {
    document.getElementById("btn").href = target;
    location.replace(target);
  } else {
    document.getElementById("msg").textContent = "No note link here.";
  }
</script>
</body>
</html>
